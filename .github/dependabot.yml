version: 2

#weekly, minor/patch grouped per ecosystem to keep PR noise low; majors come as separate PRs
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  #also bumps the commit SHAs actions are pinned to
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  #base images: patches only; Java/Node majors are moved to the next LTS by hand
  #(Dependabot would also offer non-LTS majors, e.g. Temurin 24, which went EOL and failed Trivy)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: node
        update-types: [version-update:semver-major]
