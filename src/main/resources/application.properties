spring.application.name=amc
spring.datasource.url=jdbc:postgresql://127.0.0.1:5444/security_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

#jwt
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

#lockout
auth.lockout.max-attempts=${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
auth.lockout.window-minutes=${AUTH_LOCKOUT_WINDOW_MINUTES:15}
