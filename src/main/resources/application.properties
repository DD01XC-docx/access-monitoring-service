spring.application.name=amc
#local secrets from .env (gitignored), skipped if missing
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://127.0.0.1:5444/security_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:root}
#schema owned by Flyway (db/migration); Hibernate only checks entities against it
spring.jpa.hibernate.ddl-auto=validate
#existing pre-Flyway DBs are marked as V1 instead of re-running the baseline
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true

#jwt
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

#lockout
auth.lockout.max-attempts=${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
auth.lockout.window-minutes=${AUTH_LOCKOUT_WINDOW_MINUTES:15}
