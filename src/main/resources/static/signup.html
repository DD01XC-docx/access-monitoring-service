    <main>
    <div class="video-bg-container">
    <video autoplay muted loop playsinline class="bg-media">
        <source src="/frontend/images/signupmovie.mp4" type="video/mp4">
    </video>
    
    <div class="bg-overlay"></div>
    
    <div class="bg-glow"></div>
</div>
    <section class="auth-section">
    <div class="glass-card">
    <div class="auth-tabs">
        <button class="tab-btn active">Register</button>
        <a href="./login.html" class="tab-btn">Sign In</a>
    </div>
    <div>
        <form id="registerForm" class="auth-form">
            <div class="input-group">
            <input id="username" type="text" minlength="3" maxlength="30" placeholder="Username" required>
            </div>
            <div class="input-group">
            <input id="email" type="email" placeholder="E-mail" required>
            </div>
            <div class="input-group">
            <input id="password" type="password" minlength="8" placeholder="Password" required>
            </div>
            
            <div class="checkbox-group">
            <a href="#">Terms of policy</a>
            </div>
            
            <button type="submit" class="submit-btn">Submit</button>
            <div id="registerMessage" class="message" style="display:none;"></div>
            
            <p class="form-footer">Do you have an account?<a href="./login.html"> Login</a></p>
        </form>
    </div>
</section>
    <script type="module" src="./frontend/scripts/signup.js"></script>
